<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报 · 每日更新</title>
<meta name="description" content="每日 AI 行业日报：大模型、产品、论文、投融资与政策动态。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0e14;
    --card: rgba(255,255,255,.035);
    --border: rgba(255,255,255,.09);
    --text: #e8ebf2;
    --muted: #9aa3b5;
    --accent1: #6e8fff;
    --accent2: #b48cff;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    background-image:
      radial-gradient(600px 300px at 15% -5%, rgba(110,143,255,.14), transparent 60%),
      radial-gradient(700px 350px at 90% 0%, rgba(180,140,255,.12), transparent 60%);
    background-attachment: fixed;
  }
  .container { max-width: 1080px; margin: 0 auto; padding: 40px 22px 70px; }
  header.top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 34px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 13px; flex: none;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 19px; color: #fff;
    box-shadow: 0 6px 24px rgba(110,143,255,.35);
  }
  .brand h1 { font-size: 26px; letter-spacing: 2px; }
  .brand p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .search-box { position: relative; }
  .search-box input {
    width: 260px; max-width: 60vw;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    border-radius: 999px; padding: 10px 38px 10px 18px;
    color: var(--text); font-size: 14px; font-family: inherit;
    outline: none; transition: border-color .15s ease, width .2s ease;
  }
  .search-box input::placeholder { color: #6b7285; }
  .search-box input:focus { border-color: rgba(110,143,255,.6); width: 300px; }
  .search-box .icon {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 15px; pointer-events: none;
  }
  .ed-line { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; letter-spacing: 1px; }
  .ed-line strong { color: var(--text); }
  mark { background: rgba(110,143,255,.35); color: #fff; border-radius: 3px; padding: 0 2px; }
  .hero {
    border-radius: 20px; padding: 30px 30px 26px; margin-bottom: 40px;
    background: linear-gradient(135deg, rgba(110,143,255,.13), rgba(180,140,255,.07));
    border: 1px solid rgba(110,143,255,.28);
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(400px 200px at 85% 20%, rgba(180,140,255,.18), transparent 65%);
    pointer-events: none;
  }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 3px; font-weight: 700;
    color: #fff; background: linear-gradient(135deg, var(--accent1), var(--accent2));
    padding: 4px 14px; border-radius: 999px; margin-bottom: 16px;
  }
  .new-badge {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1px;
    color: #fff; background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border-radius: 6px; padding: 2px 8px; margin-right: 8px; vertical-align: 2px;
  }
  .hero h2 { font-size: 27px; line-height: 1.45; margin-bottom: 14px; }
  .hero p { color: #c6ccda; font-size: 15.5px; }
  .hero .src { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .section { margin-bottom: 38px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  .section h3 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .section h3::before {
    content: ""; width: 5px; height: 20px; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent1), var(--accent2));
  }
  .sec-pager { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .sec-pager button {
    border: 1px solid var(--border); background: rgba(255,255,255,.03);
    color: var(--text); border-radius: 999px; padding: 4px 14px;
    font-size: 13px; font-family: inherit; cursor: pointer;
    transition: border-color .15s ease, opacity .15s ease;
  }
  .sec-pager button:hover:not(:disabled) { border-color: rgba(110,143,255,.5); }
  .sec-pager button:disabled { opacity: .3; cursor: default; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px;
    transition: transform .18s ease, border-color .18s ease;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(110,143,255,.4); }
  .card h4 { font-size: 16.5px; line-height: 1.5; margin-bottom: 10px; }
  .card p { font-size: 14px; color: var(--muted); flex: 1; }
  .card .src { margin-top: 14px; font-size: 12.5px; color: #7c8496; }
  .card .src a, .hero .src a, .brief .src a, .search-meta a { color: var(--accent1); text-decoration: none; }
  .card .src a:hover, .hero .src a:hover, .brief .src a:hover, .search-meta a:hover { text-decoration: underline; }
  .card .src .fetched, .hero .src .fetched, .brief .src .fetched { margin-top: 2px; color: #626b7e; font-size: 12px; }
  .card .ed-tag {
    display: inline-block; align-self: flex-start; font-size: 12px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; margin-bottom: 10px;
  }
  .briefs { display: flex; flex-direction: column; gap: 12px; }
  .brief {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 20px; font-size: 14.5px;
  }
  .brief strong { display: block; font-size: 15px; margin-bottom: 4px; }
  .brief span { color: var(--muted); font-size: 13.5px; }
  .brief .src, .search-meta { margin-top: 8px; font-size: 12.5px; color: #7c8496; }
  .search-title { font-size: 17px; margin-bottom: 20px; color: var(--muted); }
  .search-title strong { color: var(--text); }
  .no-result { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 15px; }
  footer {
    margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border);
    color: #7c8496; font-size: 13px; display: flex; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
  }
  .loading, .error { text-align: center; color: var(--muted); padding: 80px 20px; font-size: 15px; }
  @media (max-width: 640px) {
    .hero h2 { font-size: 22px; }
    .hero { padding: 24px 20px; }
    .search-box input { width: 200px; }
    .search-box input:focus { width: 220px; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="top">
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <h1>AI 日报</h1>
        <p>大模型 · 产品 · 论文 · 投融资 · 政策 — 每日更新</p>
      </div>
    </div>
    <div class="search-box">
      <input id="searchInput" type="search" placeholder="搜索标题、摘要、来源…" autocomplete="off">
      <span class="icon">⌕</span>
    </div>
  </header>

  <div id="app"><div class="loading">正在加载今日日报…</div></div>

  <footer>
    <span>由 hanhan 每日自动抓取公开新闻生成，仅供学习交流。</span>
    <span>ai.shuyu.me</span>
  </footer>
</div>
<script>
var editions = [];   // [{date, weekday, data}] 最新在前
var secState = {};  // section index -> {page, items, dateIdx, exhausted, loading}
var query = "";
var PAGE = 6;

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function hi(s, q) {
  var t = esc(s);
  if (!q) return t;
  var qe = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try { return t.replace(new RegExp(qe, "gi"), "<mark>$&</mark>"); }
  catch (e) { return t; }
}
function srcLabel(item) {
  var label = esc(item.source || "");
  if (item.url) {
    return '来源：<a href="' + esc(item.url) + '" target="_blank" rel="noopener">' + label + " ↗</a>";
  }
  return "来源：" + label;
}
function metaLine(item) {
  var s = "<div>" + srcLabel(item) + "</div>";
  if (item.fetched_at) s += '<div class="fetched">抓取于 ' + esc(item.fetched_at) + "</div>";
  return s;
}
function isNewItem(it, mmdd) {
  return !!(it.fetched_at && it.fetched_at.indexOf(mmdd) === 0);
}
function newBadge() {
  return '<span class="new-badge">NEW</span>';
}
function cardHtml(it, q, edTag, isNew) {
  var tag = edTag ? '<span class="ed-tag">' + esc(edTag) + "</span>" : "";
  var nb = isNew ? newBadge() : "";
  return '<article class="card">' + tag + "<h4>" + nb + hi(it.title, q) + "</h4><p>" + hi(it.summary, q) +
    '</p><div class="src">' + metaLine(it) + "</div></article>";
}
function showError(msg) {
  document.getElementById("app").innerHTML = '<div class="error">' + esc(msg) + "</div>";
}

// 首页只渲染最新一期；各板块翻页时按需加载更早一期的该板块内容
function homeSections() {
  var d = editions[0].data;
  var arr = (d.sections || []).map(function (s) { return { name: s.name, kind: "sec" }; });
  if (d.briefs && d.briefs.length) arr.push({ name: "一句话观察", kind: "briefs" });
  return arr;
}
function sectionItemsOf(e, name) {
  var secs = (e.data.sections || []).filter(function (s) { return s.name === name; });
  return secs.length ? (secs[0].items || []) : [];
}
function getSecState(si) {
  var st = secState[si];
  if (!st) {
    var hs = homeSections()[si];
    var today = [];
    function push(it) {
      today.push({ it: it, emmdd: editions[0].data.date.slice(5), edate: editions[0].date });
    }
    if (hs.kind === "briefs") (editions[0].data.briefs || []).forEach(push);
    else sectionItemsOf(editions[0], hs.name).forEach(push);
    // today: 最新一期的内容；older: 点击翻页时按需加载的往期内容，翻完 today 才翻 older
    st = { page: 0, today: today, older: [], dateIdx: 1, exhausted: allDates.length <= 1, loading: false, name: hs.name, kind: hs.kind };
    secState[si] = st;
  }
  return st;
}
// 总页数 = today 的页数 + 已加载 older 的页数
function secPages(st) {
  var tp = Math.max(1, Math.ceil(st.today.length / PAGE));
  return { todayPages: tp, total: tp + Math.ceil(st.older.length / PAGE) };
}
function secSlice(st, p) {
  var tp = Math.max(1, Math.ceil(st.today.length / PAGE));
  if (p < tp) return st.today.slice(p * PAGE, p * PAGE + PAGE);
  var q = p - tp;
  return st.older.slice(q * PAGE, q * PAGE + PAGE);
}
// 非最新一期的卡片标上日期
function edTagOf(x) {
  return x.edate === editions[0].date ? "" : x.edate.slice(5);
}
function pagerHtml2(si, st, pages, p) {
  var prevDis = (p === 0 || st.loading) ? " disabled" : "";
  var nextDis = (st.loading || (st.exhausted && p >= pages - 1)) ? " disabled" : "";
  var label = st.loading ? "加载中…" : "第 " + (p + 1) + " 页";
  return '<div class="sec-pager"><button data-s="' + si + '" data-d="-1"' + prevDis + ">‹ 上一页</button>" +
    "<span>" + label + "</span>" +
    '<button data-s="' + si + '" data-d="1"' + nextDis + ">下一页 ›</button></div>";
}
function renderEdition() {
  var latest = editions[0];
  if (!latest) { showError("暂无日报数据。"); return; }
  var d = latest.data;
  var mmdd = d.date.slice(5);
  document.title = "AI 日报 · " + d.date;

  var hs = homeSections();
  var h = '<div class="ed-line"><strong>' + esc(d.date) + "</strong> · " + esc(d.weekday || "") +
    " · 最新一期" + (allDates.length > 1 ? "（共 " + allDates.length + " 期往期可翻）" : "") + "</div>";

  if (d.headline) {
    h += '<section class="hero"><span class="kicker">今日头条</span><h2>' + (isNewItem(d.headline, mmdd) ? newBadge() : "") + esc(d.headline.title) + "</h2><p>" +
      esc(d.headline.summary) + '</p><div class="src">' + metaLine(d.headline) + "</div></section>";
  }

  hs.forEach(function (s, si) {
    var st = getSecState(si);
    var pg = secPages(st);
    var p = Math.min(st.page, pg.total - 1);
    st.page = p;
    var slice = secSlice(st, p);
    h += '<section class="section"><div class="section-head"><h3>' + esc(s.name) + "</h3>";
    if (pg.total > 1 || !st.exhausted) h += pagerHtml2(si, st, pg.total, p);
    if (s.kind === "briefs") {
      h += '</div><div class="briefs">';
      slice.forEach(function (x) {
        h += '<div class="brief"><strong>' + (isNewItem(x.it, x.emmdd) ? newBadge() : "") + esc(x.it.title) + "</strong><span>" + esc(x.it.summary) +
          '</span><div class="src">' + metaLine(x.it) + "</div></div>";
      });
      h += "</div></section>";
    } else {
      h += '</div><div class="cards">';
      slice.forEach(function (x) { h += cardHtml(x.it, "", edTagOf(x), isNewItem(x.it, x.emmdd)); });
      h += "</div></section>";
    }
  });

  document.getElementById("app").innerHTML = h;
}

// 按需加载：点击"下一页"时才去取更早一期的该板块内容
function loadMore(si) {
  var st = secState[si];
  if (!st || st.dateIdx >= allDates.length) {
    if (st) { st.exhausted = true; st.loading = false; }
    render();
    return;
  }
  fetchOne(allDates[st.dateIdx]).then(function (e) {
    st.dateIdx++;
    var list = st.kind === "briefs" ? (e.data.briefs || []) : sectionItemsOf(e, st.name);
    list.forEach(function (it) {
      st.older.push({ it: it, emmdd: e.data.date.slice(5), edate: e.date });
    });
    if (st.dateIdx >= allDates.length) st.exhausted = true;
    if (list.length === 0 && !st.exhausted) { loadMore(si); return; }  // 这一期该板块没内容，继续往前找
    st.loading = false;
    st.page++;
    render();
  }).catch(function () { st.loading = false; render(); });
}

function renderSearch() {
  var q = query.trim().toLowerCase();
  var total = 0;
  var h = '<div class="search-title">搜索 <strong>“' + esc(query.trim()) + '”</strong>，共 <strong id="srCount">…</strong> 条结果（全部往期）</div>';
  editions.forEach(function (e) {
    var d = e.data;
    var hits = [];
    function match(it, secName) {
      var t = [it.title, it.summary, it.source].join(" ").toLowerCase();
      if (t.indexOf(q) !== -1) hits.push({ it: it, sec: secName });
    }
    if (d.headline) match(d.headline, "头条");
    (d.sections || []).forEach(function (sec) {
      (sec.items || []).forEach(function (it) { match(it, sec.name); });
    });
    (d.briefs || []).forEach(function (b) { match(b, "一句话观察"); });
    if (hits.length) {
      total += hits.length;
      var emmdd = d.date.slice(5);
      h += '<section class="section"><div class="section-head"><h3>' + esc(d.date) + " · " + esc(d.weekday || "") + "</h3></div>";
      h += '<div class="cards">';
      hits.forEach(function (x) { h += cardHtml(x.it, query.trim(), x.sec, isNewItem(x.it, emmdd)); });
      h += "</div></section>";
    }
  });
  if (!total) {
    h += '<div class="no-result">没有找到相关内容，换个关键词试试。</div>';
  }
  document.getElementById("app").innerHTML = h;
  var c = document.getElementById("srCount");
  if (c) c.textContent = total;
}

function render() {
  if (query.trim()) renderSearch();
  else renderEdition();
}

document.getElementById("app").addEventListener("click", function (ev) {
  var b = ev.target.closest("button[data-s]");
  if (!b || b.disabled) return;
  var si = parseInt(b.getAttribute("data-s"), 10);
  var dd = parseInt(b.getAttribute("data-d"), 10);
  var st = secState[si];
  if (!st || st.loading) return;
  if (dd < 0) {
    st.page = Math.max(0, st.page - 1);
    render();
    return;
  }
  var pg = secPages(st);
  if (st.page + 1 < pg.total) { st.page++; render(); return; }
  if (st.exhausted) return;
  st.loading = true;
  render();
  loadMore(si);  // 今天的内容翻完，才去取更早一期
});

var searchTimer = null;
var olderLoaded = false, olderLoading = false, allDates = [];

// 搜索需要全部往期数据：只在用户真正搜索时才加载（首页翻页是按板块按需加载，不走这里）
var edCache = {};  // 同个日期只请求一次，各板块按需加载时共享
function fetchOne(en) {
  if (edCache[en.date]) return Promise.resolve(edCache[en.date]);
  return fetch("data/" + en.date + ".json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function (d) { var e = { date: en.date, weekday: en.weekday, data: d }; edCache[en.date] = e; return e; });
}
function ensureOlder() {
  if (olderLoaded || olderLoading || allDates.length <= 1) return;
  olderLoading = true;
  Promise.all(allDates.slice(1).map(fetchOne)).then(function (list) {
    olderLoaded = true;
    editions = editions.concat(list.filter(function (e) { return !!e; }));
    render();
  }).catch(function () { olderLoading = false; });
}

document.getElementById("searchInput").addEventListener("input", function (ev) {
  clearTimeout(searchTimer);
  var v = ev.target.value;
  searchTimer = setTimeout(function () {
    query = v;
    secState = {};
    if (v.trim()) ensureOlder();  // 搜索时确保往期已加载，保证结果完整
    render();
  }, 250);
});

fetch("data/index.json", { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
  .then(function (idx) {
    var ds = (idx && idx.dates) || [];
    if (!ds.length) { showError("暂无日报数据。"); return null; }
    ds.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    allDates = ds;
    return fetchOne(ds[0]);  // 首屏只加载最新一期
  })
  .then(function (e) {
    if (!e) return;
    editions = [e];
    render();
  })
  .catch(function () { showError("日报数据加载失败，请稍后刷新重试。"); });
</script>
</body>
</html>
